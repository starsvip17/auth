<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licencias - STARS VIP</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --sidebar-bg: #111111;
            --card-bg: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-color: #2a2a2a;
            --accent-green: #00c853; 
            --accent-green-bg: rgba(0, 200, 83, 0.1);
            --accent-red: #e52e4d;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: var(--font-family); display: flex; height: 100vh; overflow: hidden; }

        /* --- BARRA LATERAL --- */
        .sidebar {
            width: 280px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 20px; height: 100%; overflow-y: auto;
        }
        .sidebar-header { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; padding-left: 5px; }
        .sidebar-header img { height: 40px; border-radius: 8px; }
        .sidebar-header h1 { font-size: 20px; font-weight: 800; }
        .sidebar-header h1 span { color: var(--accent-green); }
        .sidebar-header p { font-size: 9px; color: var(--text-muted); }
        
        .current-app { background-color: transparent; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; display: flex; align-items: center; gap: 12px; margin-bottom: 25px; }
        .app-icon { background-color: var(--accent-green-bg); color: var(--accent-green); padding: 8px; border-radius: 8px; }
        .app-icon svg { width: 18px; height: 18px; }
        .app-info span { font-size: 10px; color: var(--text-muted); display: block; }
        .app-info strong { font-size: 14px; font-weight: 600; }

        .mi-cuenta-link { display: flex; justify-content: space-between; padding: 15px 10px; color: var(--text-muted); text-decoration: none; font-size: 14px; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); margin: 15px 0; }
        .mi-cuenta-link:hover { color: var(--text-main); }

        .nav-section { margin-bottom: 20px; }
        .nav-title { font-size: 10px; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 10px; padding-left: 10px; }
        .nav-menu { list-style: none; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 8px; color: var(--text-muted); text-decoration: none; font-size: 14px; transition: 0.3s; }
        .nav-link:hover { background-color: rgba(255, 255, 255, 0.05); color: var(--text-main); }
        .nav-link.active { background-color: var(--accent-green-bg); color: var(--accent-green); font-weight: 500; }
        .nav-link svg { width: 18px; height: 18px; }

        .user-profile { margin-top: auto; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; display: flex; align-items: center; justify-content: space-between; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 35px; height: 35px; border-radius: 50%; overflow: hidden; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-details strong { font-size: 13px; display: block; }
        .user-details span { font-size: 10px; color: var(--accent-green); font-weight: bold; }
        .logout-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; }
        .logout-btn:hover { color: #ff4444; }

        /* --- CONTENIDO PRINCIPAL --- */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        
        /* Tarjetas de estadísticas */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card {
            background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 20px; display: flex; align-items: center; gap: 15px; position: relative; overflow: hidden;
        }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background-color: var(--border-color); }
        .stat-card.total::before { background-color: var(--accent-red); }
        .stat-card.unused::before { background-color: #5b6ee1; }
        .stat-card.used::before { background-color: var(--accent-green); }
        .stat-card.banned::before { background-color: #f5a623; }

        .stat-icon { width: 45px; height: 45px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .stat-card.total .stat-icon { background-color: rgba(229, 46, 77, 0.1); color: var(--accent-red); }
        .stat-card.unused .stat-icon { background-color: rgba(91, 110, 225, 0.1); color: #5b6ee1; }
        .stat-card.used .stat-icon { background-color: rgba(0, 200, 83, 0.1); color: var(--accent-green); }
        .stat-card.banned .stat-icon { background-color: rgba(245, 166, 35, 0.1); color: #f5a623; }

        .stat-info h3 { font-size: 24px; margin-bottom: 2px; }
        .stat-info p { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        /* Botones de acción */
        .action-buttons { display: flex; flex-direction: column; gap: 15px; max-width: 400px; margin-bottom: 40px; }
        .btn-main { background-color: var(--accent-red); color: white; border: none; border-radius: 8px; padding: 15px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; justify-content: center; transition: 0.3s; }
        .btn-main:hover { opacity: 0.9; }
        
        .btn-secondary { background-color: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; transition: 0.3s; }
        .btn-secondary:hover { border-color: #444; }

        /* Tabla de licencias */
        .table-container { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: rgba(255,255,255,0.02); padding: 15px 20px; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); }
        td { padding: 15px 20px; font-size: 14px; border-bottom: 1px solid var(--border-color); }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: rgba(255,255,255,0.02); }

        .status { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status.active { background-color: var(--accent-green-bg); color: var(--accent-green); }
        .status.expired { background-color: rgba(255, 68, 68, 0.1); color: #ff4444; }
        
        .action-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.3s; }
        .action-btn:hover { border-color: var(--accent-green); color: var(--accent-green); }

        /* --- MODAL CREAR CLAVE --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center;
        }
        .modal {
            background: var(--card-bg); border: 1px solid var(--border-color); padding: 25px;
            border-radius: 12px; width: 100%; max-width: 450px; max-height: 90vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 18px; }
        .close-btn { background: #2a2a2a; border: none; color: white; width: 30px; height: 30px; border-radius: 6px; cursor: pointer; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; background: transparent; border: 1px solid var(--border-color);
            border-radius: 8px; color: white; outline: none; font-family: var(--font-family);
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent-green); }
        
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent-red); }
        .checkbox-group label { font-size: 14px; margin: 0; color: var(--text-main); }

        .modal-actions { display: flex; gap: 10px; margin-top: 25px; }
        .btn-cancel { background: transparent; border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 8px; cursor: pointer; flex: 1; }
        .btn-save { background: var(--accent-red); border: none; color: white; font-weight: bold; padding: 12px; border-radius: 8px; cursor: pointer; flex: 1; }
    </style>
</head>
<body>

    <!-- BARRA LATERAL -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="logo.jpeg" alt="Logo">
            <div>
                <h1>STARS <span>VIP</span></h1>
                <p>AUTH WORKSPACE</p>
            </div>
        </div>

        <div class="current-app">
            <div class="app-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg></div>
            <div class="app-info"><span>APP ACTUAL</span><strong>STARS VIP</strong></div>
        </div>

        <a href="app.html" class="mi-cuenta-link"><span>← Volver al Inicio</span></a>

        <div class="nav-section">
            <ul class="nav-menu">
                <li><a href="app.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg> Gestionar aplicaciones</a></li>
            </ul>
        </div>

        <div class="nav-section">
            <div class="nav-title">APLICACIÓN</div>
            <ul class="nav-menu">
                <li><a href="licencias.html" class="nav-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg> Licencias</a></li>
                <li><a href="usuarios.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> Usuarios</a></li>
            </ul>
        </div>

        <div class="user-profile">
            <div class="user-info">
                <div class="user-avatar"><img src="logo.jpeg" alt="Avatar"></div>
                <div class="user-details"><strong>admin_starsvip</strong><span>ADMIN</span></div>
            </div>
            <button class="logout-btn" onclick="window.location.href='index.html'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        <!-- Panel de Estadísticas -->
        <div class="stats-grid">
            <div class="stat-card total">
                <div class="stat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg></div>
                <div class="stat-info"><h3 id="statTotal">0</h3><p>Licencias Totales</p></div>
            </div>
            <div class="stat-card unused">
                <div class="stat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></div>
                <div class="stat-info"><h3 id="statUnused">0</h3><p>Sin Usar</p></div>
            </div>
            <div class="stat-card used">
                <div class="stat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>
                <div class="stat-info"><h3 id="statUsed">0</h3><p>Usadas</p></div>
            </div>
            <div class="stat-card banned">
                <div class="stat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg></div>
                <div class="stat-info"><h3 id="statBanned">0</h3><p>Baneadas</p></div>
            </div>
        </div>

        <!-- Botones de Acción -->
        <div class="action-buttons">
            <button class="btn-main" onclick="abrirModal()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Crear claves
            </button>
            <button class="btn-secondary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                Añadir tiempo a claves sin usar
            </button>
            <button class="btn-secondary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Importar claves
            </button>
        </div>

        <!-- Tabla -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Licencia (Key)</th>
                        <th>Usuario</th>
                        <th>Duración</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaLicencias">
                    <tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">Cargando datos...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- MODAL CREAR CLAVE -->
    <div class="modal-overlay" id="modalCrear">
        <div class="modal">
            <div class="modal-header">
                <h3>Create A New Key</h3>
                <button class="close-btn" onclick="cerrarModal()">✕</button>
            </div>

            <div class="form-group">
                <label>Nombre de Usuario (Obligatorio para tu API)</label>
                <input type="text" id="newUsername" placeholder="Ej: mati01" required>
            </div>

            <div class="form-group">
                <label>License Duration (Días)</label>
                <input type="number" id="newDays" value="30" min="1" max="36500">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="chkLower" checked>
                <label for="chkLower">Include Lowercase Letters</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="chkUpper" checked>
                <label for="chkUpper">Include Uppercase Letters</label>
            </div>

            <div class="form-group">
                <label>License Expiry Unit</label>
                <select disabled><option>Days</option></select>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-save" onclick="crearClave()">Generar Clave</button>
            </div>
        </div>
    </div>

    <script>
        // URL de tu Proxy Seguro en Cloudflare
        const API_URL = 'https://starsvip-api-proxy.naooko18.workers.dev/api/licenses';

        // 1. Cargar Datos y Actualizar Estadísticas
        async function cargarLicencias() {
            const tabla = document.getElementById('tablaLicencias');
            
            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) throw new Error('Error en la API');
                const licencias = await response.json();

                // Actualizar contadores
                document.getElementById('statTotal').innerText = licencias.length;
                document.getElementById('statUnused').innerText = licencias.filter(l => l.active && l.daysValid > 0).length; 
                document.getElementById('statUsed').innerText = licencias.filter(l => !l.active).length; 
                document.getElementById('statBanned').innerText = 0; // Tu API no maneja baneos directos, se puede adaptar

                if (licencias.length === 0) {
                    tabla.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">No hay licencias generadas aún.</td></tr>`;
                    return;
                }

                tabla.innerHTML = licencias.map(lic => `
                    <tr>
                        <td style="font-family: monospace; color: var(--accent-green); font-weight: bold;">${lic.key}</td>
                        <td>${lic.username}</td>
                        <td>${lic.daysValid} días</td>
                        <td><span class="status ${lic.active ? 'active' : 'expired'}">${lic.active ? 'Activa' : 'Expirada'}</span></td>
                        <td>
                            <button class="action-btn" onclick="copiarTexto('${lic.key}')">Copiar</button>
                        </td>
                    </tr>
                `).join('');

            } catch (error) {
                console.error(error);
                tabla.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ff4444; padding: 30px;">Error de conexión con el servidor.</td></tr>`;
            }
        }

        // 2. Control del Modal
        function abrirModal() { document.getElementById('modalCrear').style.display = 'flex'; }
        function cerrarModal() { document.getElementById('modalCrear').style.display = 'none'; }

        // 3. Crear Clave (POST)
        async function crearClave() {
            const username = document.getElementById('newUsername').value;
            const days = document.getElementById('newDays').value;

            if (!username || !days) {
                return alert("Debes llenar el nombre de usuario y los días.");
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        days: parseInt(days),
                        tier: "vip"
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Alerta con opción de copiar
                    const mensaje = `¡Licencia generada con éxito!\n\nUsuario: ${data.username}\nKey: ${data.key}\nExpira: ${new Date(data.expiresAt).toLocaleDateString()}\n\n¿Deseas copiar la Key al portapapeles?`;
                    
                    if (confirm(mensaje)) {
                        navigator.clipboard.writeText(data.key);
                        alert("✅ Licencia copiada al portapapeles.");
                    }
                    
                    cerrarModal();
                    cargarLicencias(); // Refrescar tabla y contadores
                } else {
                    alert("Error de la API: " + (data.error || "Desconocido"));
                }
            } catch (error) {
                console.error(error);
                alert("Error de red al generar la licencia.");
            }
        }

        function copiarTexto(texto) {
            navigator.clipboard.writeText(texto);
            alert("Licencia copiada: " + texto);
        }

        // Iniciar
        document.addEventListener('DOMContentLoaded', cargarLicencias);
    </script>
</body>
</html>
