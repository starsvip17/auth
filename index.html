<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - xMMNF</title>
    <style>
        /* --- ESTILOS GLOBALES --- */
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #151515;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-color: #333333;
            /* CAMBIO A VERDE AQUÍ */
            --accent-green: #00c853; 
            --accent-green-hover: #00a344;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            padding: 20px;
        }

        /* --- HEADER / LOGO --- */
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 400px;
        }

        .header img {
            height: 45px;
            width: auto;
            border-radius: 8px; /* Por si tu logo es cuadrado */
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        
        .header h1 span {
            color: var(--accent-green);
        }

        /* --- TARJETA DE LOGIN --- */
        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--text-main);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .badge svg {
            width: 14px;
            height: 14px;
            fill: var(--accent-green);
        }

        .login-card h2 {
            font-size: 28px;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* --- FORMULARIO --- */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .form-group label span {
            color: var(--text-muted);
            font-size: 12px;
            margin-left: 5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 15px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-wrapper input:focus {
            border-color: var(--accent-green); /* Borde verde al enfocar */
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: var(--text-main);
        }

        /* --- BOTÓN --- */
        .btn-submit {
            width: 100%;
            background-color: var(--accent-green); /* Botón Verde */
            color: white;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            transition: background-color 0.3s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: var(--accent-green-hover);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <!-- AQUÍ ESTÁ TU LOGO CONFIGURADO -->
        <img src="logo.jpeg" alt="Logo xMMNF">
        <h1>xMMNF <span>x$</span></h1>
    </div>

    <!-- TARJETA DE LOGIN -->
    <div class="login-card">
        <a href="#" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Volver al inicio
        </a>

        <div class="badge">
            <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
            xMMNF ACCESS
        </div>

        <h2>Bienvenido de nuevo.</h2>
        <p>Entra a tu cuenta y continúa donde lo dejaste.</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Usuario</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="" required>
                </div>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="" required>
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <!-- Icono de ojo -->
                        <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>2FA <span>(Verificación en dos pasos)</span></label>
                <div class="input-wrapper">
                    <input type="text" id="twoFactor" placeholder="">
                </div>
            </div>

            <button type="submit" class="btn-submit">
                Iniciar sesión
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </form>
    </div>

    <script>
        // Función para mostrar/ocultar la contraseña
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.style.stroke = '#00c853'; // Cambia a verde cuando se ve
            } else {
                passwordInput.type = 'password';
                eyeIcon.style.stroke = 'currentColor';
            }
        }

        // Manejo del formulario de login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const twoFactor = document.getElementById('twoFactor').value;

            // AQUÍ ES DONDE CONECTAS TU API
            // He actualizado el comentario con la URL de tu API
            /*
            try {
                const response = await fetch('https://sxnt-license-api-production.up.railway.app/login', { // <-- Revisa si la ruta es /login o /auth
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer sxntana1302'
                    },
                    body: JSON.stringify({
                        username: user,
                        password: pass,
                        twoFactor: twoFactor
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    window.location.href = 'app.html'; // Redirige al panel
                } else {
                    alert('Error: ' + (data.message || 'Credenciales incorrectas'));
                }
            } catch (error) {
                console.error('Error de conexión:', error);
                alert('Error al conectar con el servidor.');
            }
            */

            // Simulación visual mientras conectas la API real
            console.log("Intentando iniciar sesión con:", { user, pass, twoFactor });
            alert("Simulación: Aquí se conectaría con la API. (Colores verdes y logo actualizados)");
        });
    </script>
</body>
</html>
