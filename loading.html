<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando... - STARS VIP</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-main: #ffffff;
            --accent-green: #00c853; 
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            flex-direction: column;
        }

        /* Contenedor del Logo y el Aro */
        .loader-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        /* El aro de carga animado */
        .spinner-ring {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.05); /* Aro de fondo sutil */
            border-top-color: var(--accent-green); /* Parte verde que gira */
            animation: spin 1s linear infinite;
        }

        /* El logo en el centro */
        .loader-logo {
            width: 80px;
            height: 80px;
            border-radius: 20px; /* Bordes redondeados como en tu imagen */
            object-fit: cover;
            background-color: #1a1a1a; /* Fondo por si el logo es transparente */
            padding: 5px;
            z-index: 2;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        /* Texto debajo del logo */
        .loader-text {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .loader-text span {
            color: var(--accent-green);
        }

        /* Barra de progreso inferior */
        .progress-bar-container {
            width: 250px;
            height: 4px;
            background-color: #2a2a2a;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-green), #00e676);
            border-radius: 4px;
            /* Animación que simula la carga */
            animation: loadProgress 2.5s ease-in-out forwards;
        }

        /* --- ANIMACIONES --- */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            20% { width: 15%; }
            50% { width: 60%; }
            80% { width: 85%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Contenedor del Logo con el aro giratorio -->
    <div class="loader-container">
        <div class="spinner-ring"></div>
        <!-- Tu logo -->
        <img src="logo.jpeg" alt="Logo" class="loader-logo">
    </div>

    <!-- Nombre de tu App -->
    <div class="loader-text">
        STARS <span>VIP</span>
    </div>

    <!-- Barra de progreso -->
    <div class="progress-bar-container">
        <div class="progress-bar-fill"></div>
    </div>

    <script>
        // Este script hace que después de 2.5 segundos (lo que dura la animación)
        // te redirija automáticamente al Workspace.
        // Si quieres que se quede más tiempo, cambia el "2500" por "4000" (4 segundos).
        
        setTimeout(() => {
            window.location.href = 'app.html';
        }, 2500);
    </script>

</body>
</html>
